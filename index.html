<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grit Day Trading Platform 交易复盘只读云端快照"
    />
    <title>Grit Day Trading Platform · 交易复盘</title>
    <link rel="stylesheet" href="./static-review.css" />
    <script defer src="./static-review.js"></script>
  </head>
  <body>
    <main class="shell cloudSnapshotShell">
      <header class="topbar">
        <section>
          <p class="eyebrow">P3 REVIEW DESK</p>
          <h1>日内交易复盘台</h1>
          <p>以 committed fills 为成交事实，复盘数据、盈亏归因与交易总结。</p>
        </section>
        <button class="uploadButton" disabled type="button">
          <span class="uploadIcon" aria-hidden="true">↻</span>
          只读云端快照
        </button>
      </header>

      <nav class="workspaceTabs" aria-label="工作区">
        <button class="workspaceTab active" type="button">
          <span class="buttonIcon" aria-hidden="true">复</span>
          交易复盘
        </button>
        <button class="workspaceTab" aria-disabled="true" disabled type="button">
          <span class="buttonIcon" aria-hidden="true">测</span>
          策略测试
        </button>
        <button class="workspaceTab" aria-disabled="true" disabled type="button">
          <span class="buttonIcon" aria-hidden="true">AI</span>
          AI 策略
        </button>
        <button class="workspaceTab" aria-disabled="true" disabled type="button">
          <span class="buttonIcon" aria-hidden="true">实</span>
          实时交易
        </button>
      </nav>

      <div class="cloudSnapshotMeta" id="snapshot-meta" aria-live="polite"></div>

      <section class="panel reviewDrillPanel" aria-label="交易复盘工作区">
        <div class="reviewDrillSurfaceTabs" role="tablist" aria-label="交易复盘视图">
          <button
            class="reviewDrillSurfaceTab active"
            id="data-review-tab"
            data-review-tab="data"
            role="tab"
            aria-controls="data-review-panel"
            aria-selected="true"
            type="button"
          >
            <span class="buttonIcon" aria-hidden="true">数</span>
            数据下钻
          </button>
          <button
            class="reviewDrillSurfaceTab"
            id="loss-review-tab"
            data-review-tab="loss"
            role="tab"
            aria-controls="loss-review-panel"
            aria-selected="false"
            type="button"
          >
            <span class="buttonIcon" aria-hidden="true">盈</span>
            盈亏复盘
          </button>
          <button
            class="reviewDrillSurfaceTab"
            id="trade-summary-tab"
            data-review-tab="summary"
            role="tab"
            aria-controls="trade-summary-panel"
            aria-selected="false"
            type="button"
          >
            <span class="buttonIcon" aria-hidden="true">结</span>
            交易总结
          </button>
        </div>

        <div class="cloudStaticNotice" id="snapshot-loading" role="status">
          正在校验交易复盘快照……
        </div>

        <div id="review-content" hidden>
          <section
            class="cloudReviewSurface"
            id="data-review-panel"
            data-review-panel="data"
            role="tabpanel"
            aria-labelledby="data-review-tab"
          ></section>
          <section
            class="cloudReviewSurface"
            id="loss-review-panel"
            data-review-panel="loss"
            role="tabpanel"
            aria-labelledby="loss-review-tab"
            hidden
          ></section>
          <section
            class="cloudReviewSurface"
            id="trade-summary-panel"
            data-review-panel="summary"
            role="tabpanel"
            aria-labelledby="trade-summary-tab"
            hidden
          ></section>
        </div>
      </section>

      <footer class="cloudSnapshotFooter">
        云端页面为脱敏只读 read model；不上传原始 STP 行、账号字段或内部调试标识。
      </footer>
    </main>
  </body>
</html>
