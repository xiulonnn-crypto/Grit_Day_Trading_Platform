<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grit Day Trading Platform 交易复盘只读云端快照"
    />
    <title>Grit Day Trading Platform · 交易复盘</title>
    <link rel="stylesheet" href="./static-review.css" />
    <script defer src="./static-review.js"></script>
  </head>
  <body>
    <main class="shell cloudSnapshotShell">
      <section class="topbar">
        <div>
          <p class="eyebrow">P2 Review Desk</p>
          <h1>日内复盘台</h1>
          <p>STP 成交证据、行情上下文、盘前 watchlist 与策略复盘信号</p>
        </div>
        <button
          class="uploadButton"
          disabled
          title="云端页面为只读快照，请在本地复盘台上传 STP TXT"
          type="button"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-up" aria-hidden="true">
            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path>
            <path d="M14 2v5a1 1 0 0 0 1 1h5"></path>
            <path d="M12 12v6"></path>
            <path d="m15 15-3-3-3 3"></path>
          </svg>
          <span>上传 STP TXT</span>
        </button>
      </section>

      <nav class="workspaceTabs" aria-label="工作区切换">
        <button aria-pressed="true" class="workspaceTab active" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-table-properties" aria-hidden="true">
            <path d="M15 3v18"></path>
            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
            <path d="M21 9H3"></path>
            <path d="M21 15H3"></path>
          </svg>
          交易复盘
        </button>
        <button aria-disabled="true" aria-pressed="false" class="workspaceTab" disabled type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal" aria-hidden="true">
            <path d="M10 5H3"></path>
            <path d="M12 19H3"></path>
            <path d="M14 3v4"></path>
            <path d="M16 17v4"></path>
            <path d="M21 12h-9"></path>
            <path d="M21 19h-5"></path>
            <path d="M21 5h-7"></path>
            <path d="M8 10v4"></path>
            <path d="M8 12H3"></path>
          </svg>
          策略测试
        </button>
        <button aria-disabled="true" aria-pressed="false" class="workspaceTab" disabled type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brain-circuit" aria-hidden="true">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"></path>
            <path d="M9 13a4.5 4.5 0 0 0 3-4"></path>
            <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"></path>
            <path d="M3.477 10.896a4 4 0 0 1 .585-.396"></path>
            <path d="M6 18a4 4 0 0 1-1.967-.516"></path>
            <path d="M12 13h4"></path>
            <path d="M12 18h6a2 2 0 0 1 2 2v1"></path>
            <path d="M12 8h8"></path>
            <path d="M16 8V5a2 2 0 0 1 2-2"></path>
            <circle cx="16" cy="13" r=".5"></circle>
            <circle cx="18" cy="3" r=".5"></circle>
            <circle cx="20" cy="21" r=".5"></circle>
            <circle cx="20" cy="8" r=".5"></circle>
          </svg>
          AI策略
        </button>
        <button aria-disabled="true" aria-pressed="false" class="workspaceTab" disabled type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-power" aria-hidden="true">
            <path d="M12 2v10"></path>
            <path d="M18.4 6.6a9 9 0 1 1-12.77.04"></path>
          </svg>
          实时交易
        </button>
      </nav>

      <div class="cloudSnapshotMeta visuallyHidden" id="snapshot-meta" aria-live="polite"></div>

      <section class="panel reviewDrillPanel" aria-label="交易复盘下钻">
        <div class="reviewDrillSurfaceTabs" role="group" aria-label="下钻复盘模块">
          <button
            aria-pressed="true"
            class="reviewDrillSurfaceTab active"
            id="data-review-tab"
            data-review-tab="data"
            aria-controls="data-review-panel"
            type="button"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-table-properties" aria-hidden="true">
              <path d="M15 3v18"></path>
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M21 9H3"></path>
              <path d="M21 15H3"></path>
            </svg>
            数据下钻
          </button>
          <button
            aria-pressed="false"
            class="reviewDrillSurfaceTab"
            id="loss-review-tab"
            data-review-tab="loss"
            aria-controls="loss-review-panel"
            type="button"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-triangle-alert" aria-hidden="true">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
              <path d="M12 9v4"></path>
              <path d="M12 17h.01"></path>
            </svg>
            盈亏复盘
          </button>
          <button
            aria-pressed="false"
            class="reviewDrillSurfaceTab"
            id="trade-summary-tab"
            data-review-tab="summary"
            aria-controls="trade-summary-panel"
            type="button"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true">
              <path d="M13 5h8"></path>
              <path d="M13 12h8"></path>
              <path d="M13 19h8"></path>
              <path d="m3 17 2 2 4-4"></path>
              <path d="m3 7 2 2 4-4"></path>
            </svg>
            交易总结
          </button>
        </div>

        <div class="cloudStaticNotice" id="snapshot-loading" role="status">
          正在校验交易复盘快照……
        </div>

        <div id="review-content" hidden>
          <section
            class="cloudReviewSurface"
            id="data-review-panel"
            data-review-panel="data"
            role="tabpanel"
            aria-labelledby="data-review-tab"
          ></section>
          <section
            class="cloudReviewSurface"
            id="loss-review-panel"
            data-review-panel="loss"
            role="tabpanel"
            aria-labelledby="loss-review-tab"
            hidden
          ></section>
          <section
            class="cloudReviewSurface"
            id="trade-summary-panel"
            data-review-panel="summary"
            role="tabpanel"
            aria-labelledby="trade-summary-tab"
            hidden
          ></section>
        </div>
      </section>

      <footer class="cloudSnapshotFooter">
        云端页面为脱敏只读 read model；不上传原始 STP 行、账号字段或内部调试标识。
      </footer>
    </main>
  </body>
</html>
